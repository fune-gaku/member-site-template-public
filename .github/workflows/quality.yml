name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # typed lint (projectService) は worker-configuration.d.ts と .astro/ の生成型を読む。
      # ファイル未生成だと CI と local で結果が乖離するため、typecheck job と同じ前処理を実施して
      # 整合させる（.dev.vars seed → wrangler types → astro sync）。astro sync は astro:actions /
      # astro:content 等の仮想モジュール型を .astro/ に生成する。これが無いと actions が any 化し、
      # 参照側で no-unsafe-* が誤検知される（local は astro check 済みで通るため乖離）。
      - name: Seed .dev.vars from example
        run: cp .dev.vars.example .dev.vars

      - name: Generate Cloudflare Workers types
        run: npx wrangler types

      - name: Generate Astro types
        run: npx astro sync

      - name: ESLint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # wrangler types は .dev.vars に書かれたキーも Env 型に含める仕様。
      # CI には .dev.vars が無い (gitignore) ため .dev.vars.example をプレースホルダ
      # としてコピーする。値は型生成には使われないので placeholder で安全。
      - name: Seed .dev.vars from example
        run: cp .dev.vars.example .dev.vars

      - name: Astro typecheck
        run: npm run typecheck

  format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npm run format:check
