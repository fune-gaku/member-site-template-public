name: npm audit

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Run npm audit
        run: npm audit --audit-level=high
