name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # tests/unit + tests/integration（Astro Container API）
      - name: Unit & integration tests
        run: npm run test

      # tests/workers（実 workerd ランタイムで CSRF 等を検証）。
      # 内部で npm run build を呼んで dist/server/wrangler.json を生成する。
      - name: Workers tests
        run: npm run test:workers
