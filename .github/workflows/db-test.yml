name: db test

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/db-test.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/db-test.yml"
  workflow_dispatch:

jobs:
  db-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Start local Postgres
        run: supabase db start

      - name: Lint database (plpgsql_check)
        run: supabase db lint

      - name: Run pgTAP tests
        run: supabase test db
